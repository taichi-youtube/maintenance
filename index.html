<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <title>メンテナンス中</title>

    <style>
        :root {
            color-scheme: light dark;

            --bg-color: #f0f4f8;
            --text-color: #333333;
            --table-bg: #ffffff;
            --table-header-bg: #f5f5f5;
            --border-color: #dddddd;
            --footer-color: #777777;
            --link-color: #0066cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #eeeeee;
                --table-bg: #1e1e1e;
                --table-header-bg: #292929;
                --border-color: #444444;
                --footer-color: #aaaaaa;
                --link-color: #66aaff;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            text-align: center;
        }

        .main {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            line-height: 2;
            flex: 1;
        }

        .main h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .main h2 {
            font-size: 21px;
            margin-top: 40px;
            margin-bottom: 12px;
        }

        .main p {
            margin: 8px 0;
        }

        .main table {
            margin: 30px auto 0;
            border-collapse: collapse;
            background: var(--table-bg);
            width: 100%;
            text-align: left;
            line-height: 1.6;
        }

        .main th,
        .main td {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
        }

        .main th {
            background: var(--table-header-bg);
            white-space: nowrap;
            width: 110px;
        }

        .main td {
            overflow-wrap: anywhere;
        }

        .main td a {
            color: var(--link-color);
            text-decoration: underline;
        }

        .main td a:hover {
            color: #ff0033;
        }

        .details {
            margin-top: 30px;
            text-align: left;
        }

        .details h2 {
            text-align: center;
        }

        .button-area {
            margin-top: 20px;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 10px 24px;
            background: #ff0033;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: #d9002b;
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible {
            outline: 3px solid var(--text-color);
            outline-offset: 3px;
        }

        footer {
            width: 100%;
            padding: 20px;
            color: var(--footer-color);
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .main {
                padding: 20px 16px;
            }

            .main h1 {
                font-size: 21px;
            }

            .main h2 {
                font-size: 19px;
            }

            .main table {
                font-size: 14px;
            }

            .main th,
            .main td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="main">

        <section class="announcement">
            <h1>システムメンテナンス中です</h1>

            <p>ただいま緊急メンテナンスを行っております。</p>
            <p>ご不便とご迷惑をおかけし、申し訳ございません。</p>
        </section>

        <section class="status">
            <table>
                <tbody>
                    <tr>
                        <th scope="row">状態</th>
                        <td>サービスを停止中</td>
                    </tr>
                    <tr>
                        <th scope="row">事由</th>
                        <td>サーバーへのサイバー攻撃</td>
                    </tr>
                    <tr>
                        <th scope="row">影響先</th>
                        <td>
                            <a href="https://www.taichi-youtube.jp">
                                www.taichi-youtube.jp
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">再開日時</th>
                        <td>未定</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="details">
            <p>
                現在、当サービスのサーバーへのサイバー攻撃により、
                サーバーの保護のためにサービスを停止しています。
            </p>

            <h2>
                現在のサービス情報は以下のサイトからご覧いただけます。
            </h2>

            <div class="button-area">
                <a href="https://status.taichi-youtube.jp" class="button">
                    サービスステータス
                </a>
            </div>
        </section>

    </main>

    <footer>
        &copy; 2026 Taichi. All Rights Reserved.
    </footer>

</body>
</html>
