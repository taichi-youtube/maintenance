<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f0f4f8">

    <title>メンテナンス中</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f4f8;
            color: #333;
            font-family: sans-serif;
            text-align: center;
        }

        .main {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            line-height: 2;
            flex: 1;
        }

        .main h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .main h2 {
            font-size: 21px;
            margin-top: 40px;
            margin-bottom: 12px;
        }

        .main h3 {
            font-size: 16px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .main p {
            margin: 8px 0;
        }

        .main table {
            margin: 30px auto 0;
            border-collapse: collapse;
            background: #fff;
            width: 100%;
            max-width: 500px;
            text-align: left;
            line-height: 1.6;
        }

        .main th,
        .main td {
            padding: 12px 16px;
            border: 1px solid #ddd;
        }

        .main th {
            background: #f5f5f5;
            white-space: nowrap;
            width: 110px;
        }

        .main td {
            overflow-wrap: anywhere;
        }

        /* 詳細情報 */
        .details {
            margin-top: 30px;
            text-align: left;
        }

        .details h2,
        .details h3 {
            text-align: center;
        }

        .details p {
            text-align: left;
        }

        footer {
            width: 100%;
            padding: 20px;
            color: #777;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .main {
                padding: 20px 16px;
            }

            .main h1 {
                font-size: 21px;
            }

            .main h2 {
                font-size: 19px;
            }

            .main table {
                font-size: 14px;
            }

            .main th,
            .main td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>システムメンテナンス中です</h1>

        <p>ただいま緊急メンテナンスを行っております。</p>
        <p>ご不便とご迷惑をおかけし、申し訳ございません。</p>

        <table>
            <tr>
                <th>状態</th>
                <td>サービスを停止中</td>
            </tr>
            <tr>
                <th>事由</th>
                <td>サーバーへのサイバー攻撃</td>
            </tr>
            <tr>
                <th>再開日時</th>
                <td>未定</td>
            </tr>
        </table>

        <div class="details">
            <h2>詳細情報</h2>

            <p>
                現在当サービスのサーバーへのサイバー攻撃により、
                サーバーの保護のために、サービスを停止しています。
            </p>

            <h3>現在のサービス情報は以下のサイトからご覧いただけます。</h3>
        </div>
    </div>

    <footer>
        &copy;2026 Taichi. All Rights Reserved.
    </footer>
</body>
</html>
